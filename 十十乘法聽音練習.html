<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十十乘法個人練習小助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FFD166',
                            green: '#06D6A0',
                            blue: '#118AB2',
                            pink: '#EF476F',
                            purple: '#8338EC',
                            bg: '#F8F9FA'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '"Fredoka"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F0F4F8;
            background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* 3D 卡片翻轉效果 */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        
        /* 動態倒數圓環平滑動畫 */
        .timer-circle {
            transition: stroke-dashoffset 1s linear;
        }

        /* 溫和彈跳動畫 */
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-gentle {
            animation: bounce-gentle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-slate-800 antialiased selection:bg-brand-yellow selection:text-slate-900">

    <!-- 頂部頁首標題列 -->
    <header class="bg-white/90 backdrop-blur-md border-b-4 border-brand-yellow sticky top-0 z-20 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-brand-yellow flex items-center justify-center text-2xl shadow-sm animate-bounce-gentle">
                    ✏️
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-slate-800 tracking-wide flex items-center gap-2">
                        十十乘法 <span class="bg-brand-pink text-white text-xs px-2.5 py-0.5 rounded-full font-bold">1x1 ~ 10x10</span>
                    </h1>
                    <p class="text-xs text-slate-500 font-bold hidden sm:block">聽音思考．自主快樂學習</p>
                </div>
            </div>
            
            <!-- 右側語音速度快選選單 -->
            <div class="flex items-center gap-2">
                <label for="header-speed-select" class="text-xs sm:text-sm font-bold text-slate-600 hidden xs:inline">🗣️ 語速：</label>
                <select id="header-speed-select" class="bg-slate-100 hover:bg-slate-200 border-2 border-slate-200 text-slate-700 font-bold text-xs sm:text-sm px-3 py-1.5 rounded-xl transition duration-200 focus:outline-none focus:border-brand-purple cursor-pointer">
                    <option value="0.5">超慢 (0.5x)</option>
                    <option value="0.7" selected>慢速 (0.7x - 預設)</option>
                    <option value="1.0">標準 (1.0x)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col items-center justify-center gap-6">

        <!-- 頂部統計資訊 Bar -->
        <div class="w-full bg-white rounded-2xl p-4 shadow-md border-2 border-slate-100 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-slate-100 px-4 py-2 rounded-xl border border-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-brand-blue text-lg"></i>
                    <span class="text-sm text-slate-500 font-bold">已練習：</span>
                    <span id="question-count" class="text-2xl font-black text-brand-blue">0</span>
                    <span class="text-sm text-slate-400 font-bold">題</span>
                </div>
                
                <div class="bg-amber-50 px-3 py-2 rounded-xl border border-amber-200 flex items-center gap-2 text-xs sm:text-sm text-amber-800 font-bold">
                    <i class="fa-solid fa-lightbulb text-amber-500"></i>
                    <span>聽音思考 5 秒揭曉答案</span>
                </div>
            </div>

            <button id="reset-stats-btn" class="text-xs font-bold text-slate-400 hover:text-slate-600 underline">
                重置統計
            </button>
        </div>

        <!-- 題目與答案 主展示卡片 (3D 翻轉) -->
        <div class="w-full max-w-lg aspect-[4/3] sm:aspect-[16/10] perspective-1000 relative">
            <div id="flashcard" class="w-full h-full transform-style-3d relative rounded-3xl shadow-xl border-4 border-white bg-white">
                
                <!-- 卡片正面：題目與 5 秒倒數 -->
                <div class="absolute inset-0 backface-hidden rounded-3xl bg-gradient-to-br from-amber-50 to-orange-50 p-6 flex flex-col items-center justify-between border-4 border-amber-200">
                    
                    <!-- 頂部提示與手動朗讀按鈕 -->
                    <div class="w-full flex justify-between items-center">
                        <span class="text-xs md:text-sm font-bold bg-amber-200/70 text-amber-900 px-3 py-1 rounded-full flex items-center gap-1.5">
                            <i class="fa-solid fa-volume-high text-amber-700 animate-pulse"></i> 聽題目思考中...
                        </span>
                        <button id="replay-audio-btn" title="重新朗讀題目 (僅讀數字)" class="w-10 h-10 rounded-full bg-white hover:bg-amber-100 text-amber-600 shadow flex items-center justify-center transition active:scale-95">
                            <i class="fa-solid fa-volume-high text-lg"></i>
                        </button>
                    </div>

                    <!-- 題目大字體 -->
                    <div class="my-auto text-center">
                        <div id="question-text" class="text-5xl sm:text-7xl font-black text-slate-800 tracking-wider">
                            準備開始
                        </div>
                        <p id="question-subtext" class="text-slate-500 font-bold mt-2 text-sm sm:text-base">請點擊下方「開始練習」按鈕</p>
                    </div>

                    <!-- 5秒圓環倒數計時器器 -->
                    <div id="timer-container" class="relative w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center opacity-30 transition-opacity">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" class="text-amber-200" fill="transparent" />
                            <circle id="timer-svg-circle" cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" class="text-brand-pink timer-circle" fill="transparent" stroke-linecap="round" stroke-dasharray="263.89" stroke-dashoffset="0" />
                        </svg>
                        <span id="timer-countdown" class="absolute text-2xl sm:text-3xl font-black text-brand-pink">5</span>
                    </div>

                </div>

                <!-- 卡片背面：答案揭曉 -->
                <div class="absolute inset-0 backface-hidden rotate-y-180 rounded-3xl bg-gradient-to-br from-emerald-50 to-teal-50 p-6 flex flex-col items-center justify-between border-4 border-emerald-200">
                    
                    <div class="w-full flex justify-between items-center">
                        <span class="text-xs md:text-sm font-bold bg-emerald-200/70 text-emerald-900 px-3 py-1 rounded-full flex items-center gap-1">
                            <i class="fa-solid fa-star text-amber-400"></i> 答案揭曉
                        </span>
                        <button id="replay-answer-audio-btn" title="重新朗讀答案數字" class="w-10 h-10 rounded-full bg-white hover:bg-emerald-100 text-emerald-600 shadow flex items-center justify-center transition active:scale-95">
                            <i class="fa-solid fa-volume-high text-lg"></i>
                        </button>
                    </div>

                    <div class="my-auto text-center">
                        <div id="answer-equation" class="text-2xl sm:text-4xl font-bold text-slate-500 mb-2">
                            7 × 9 =
                        </div>
                        <div id="answer-text" class="text-6xl sm:text-8xl font-black text-brand-green tracking-tight drop-shadow-sm">
                            63
                        </div>
                    </div>

                    <div class="text-xs sm:text-sm font-bold text-teal-700 bg-teal-100/70 px-4 py-1.5 rounded-full">
                        <span id="auto-next-tip">🎉 3 秒後自動進入下一題...</span>
                    </div>

                </div>

            </div>
        </div>

        <!-- 主控制按鈕區 -->
        <div class="w-full max-w-lg flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4">
            
            <!-- 開始 / 暫停 / 繼續 按鈕 -->
            <button id="start-pause-btn" class="w-full sm:flex-1 py-4 px-6 rounded-2xl bg-brand-green hover:bg-emerald-500 active:scale-95 text-white font-black text-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-3">
                <i class="fa-solid fa-play text-2xl"></i>
                <span>開始練習</span>
            </button>

            <!-- 下一題 按鈕 -->
            <button id="next-btn" disabled class="w-full sm:w-auto py-4 px-8 rounded-2xl bg-brand-blue hover:bg-sky-600 active:scale-95 text-white font-black text-xl shadow-lg shadow-sky-200 transition-all flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none">
                <span>下一題</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <!-- 停止 按鈕 -->
            <button id="stop-btn" disabled class="w-full sm:w-auto py-4 px-5 rounded-2xl bg-rose-100 hover:bg-rose-200 active:scale-95 text-rose-600 font-bold text-lg border border-rose-200 transition flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none">
                <i class="fa-solid fa-square"></i>
                <span class="sm:hidden">停止</span>
            </button>

        </div>

    </main>

    <!-- 頁尾宣告 -->
    <footer class="mt-auto py-4 text-center text-slate-400 text-xs font-bold">
        專為國小學生設計 ｜ 語音朗讀只唸數字，留出思考空間
    </footer>

    <!-- JavaScript 核心控制引擎 -->
    <script>
        class MultiplicationApp {
            constructor() {
                // 狀態管理
                this.state = {
                    num1: 0,
                    num2: 0,
                    answer: 0,
                    isRunning: false,
                    isPaused: false,
                    isFlipped: false,
                    timerSeconds: 5,
                    totalPracticed: 0,
                    timerId: null,
                    autoNextTimeoutId: null
                };

                // 設定參數 (預設 0.7 慢速)
                this.speechRate = 0.7;

                // Web Speech API
                this.synth = window.speechSynthesis;
                this.zhVoice = null;

                // DOM 元素引用
                this.dom = {
                    flashcard: document.getElementById('flashcard'),
                    questionText: document.getElementById('question-text'),
                    questionSubtext: document.getElementById('question-subtext'),
                    answerEquation: document.getElementById('answer-equation'),
                    answerText: document.getElementById('answer-text'),
                    timerContainer: document.getElementById('timer-container'),
                    timerSvgCircle: document.getElementById('timer-svg-circle'),
                    timerCountdown: document.getElementById('timer-countdown'),
                    questionCount: document.getElementById('question-count'),
                    startPauseBtn: document.getElementById('start-pause-btn'),
                    nextBtn: document.getElementById('next-btn'),
                    stopBtn: document.getElementById('stop-btn'),
                    replayAudioBtn: document.getElementById('replay-audio-btn'),
                    replayAnswerAudioBtn: document.getElementById('replay-answer-audio-btn'),
                    headerSpeedSelect: document.getElementById('header-speed-select'),
                    resetStatsBtn: document.getElementById('reset-stats-btn'),
                    autoNextTip: document.getElementById('auto-next-tip')
                };

                this.initSpeech();
                this.bindEvents();
            }

            /**
             * 初始化 Web Speech API 語音引擎
             */
            initSpeech() {
                if ('speechSynthesis' in window) {
                    const loadVoices = () => {
                        const voices = this.synth.getVoices();
                        // 優先尋找 台灣中文 (zh-TW)
                        this.zhVoice = voices.find(v => v.lang.includes('zh-TW')) ||
                                       voices.find(v => v.lang.includes('zh')) || null;
                    };
                    loadVoices();
                    if (speechSynthesis.onvoiceschanged !== undefined) {
                        speechSynthesis.onvoiceschanged = loadVoices;
                    }
                }
            }

            /**
             * 綁定介面按鈕事件
             */
            bindEvents() {
                this.dom.startPauseBtn.addEventListener('click', () => this.toggleStartPause());
                this.dom.nextBtn.addEventListener('click', () => this.nextQuestion());
                this.dom.stopBtn.addEventListener('click', () => this.stopPractice());

                // 手動點擊聲音圖示朗讀
                this.dom.replayAudioBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.speakQuestion();
                });
                this.dom.replayAnswerAudioBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.speakAnswer();
                });

                // 語速變動監聽
                this.dom.headerSpeedSelect.addEventListener('change', (e) => {
                    this.speechRate = parseFloat(e.target.value);
                });

                // 重置統計
                this.dom.resetStatsBtn.addEventListener('click', () => {
                    this.state.totalPracticed = 0;
                    this.dom.questionCount.textContent = "0";
                });
            }

            /**
             * 語音朗讀核心函式
             */
            speak(text, onEndCallback = null) {
                if (!('speechSynthesis' in window)) return;
                
                // 強制清空先前積壓的語音
                this.synth.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                if (this.zhVoice) {
                    utterance.voice = this.zhVoice;
                }
                utterance.lang = 'zh-TW';
                utterance.rate = this.speechRate; // 使用當前速度設定 (預設 0.7)
                utterance.pitch = 1.0;

                if (onEndCallback) {
                    utterance.onend = onEndCallback;
                }

                this.synth.speak(utterance);
            }

            /**
             * 【需求亮點】朗讀題目：題目為 7 × 9 時，僅朗讀「7、9」
             */
            speakQuestion() {
                if (!this.state.num1 || !this.state.num2) return;
                const text = `${this.state.num1}、${this.state.num2}`;
                this.speak(text);
            }

            /**
             * 【需求亮點】朗讀答案：僅朗讀答案數字，例如「63」
             */
            speakAnswer() {
                if (!this.state.answer) return;
                const text = `${this.state.answer}`;
                this.speak(text);
            }

            /**
             * 開始 / 暫停 / 繼續控制邏輯
             */
            toggleStartPause() {
                if (!this.state.isRunning) {
                    this.state.isRunning = true;
                    this.state.isPaused = false;
                    this.updateUIForRunningState();
                    this.nextQuestion();
                } else if (this.state.isPaused) {
                    this.state.isPaused = false;
                    this.updateStartPauseBtnUI();
                    if (!this.state.isFlipped) {
                        this.startCountdown();
                    }
                } else {
                    this.state.isPaused = true;
                    this.updateStartPauseBtnUI();
                    clearInterval(this.state.timerId);
                    clearTimeout(this.state.autoNextTimeoutId);
                    this.synth.cancel();
                }
            }

            /**
             * 停止練習
             */
            stopPractice() {
                this.state.isRunning = false;
                this.state.isPaused = false;
                clearInterval(this.state.timerId);
                clearTimeout(this.state.autoNextTimeoutId);
                this.synth.cancel();

                this.flipCard(false);

                this.dom.questionText.textContent = "準備開始";
                this.dom.questionSubtext.textContent = "請點擊下方「開始練習」按鈕";
                this.dom.timerContainer.classList.add('opacity-30');
                this.dom.timerCountdown.textContent = "5";
                this.updateCircleProgress(5, 5);

                this.updateUIForStoppedState();
            }

            /**
             * 產生下一題
             */
            nextQuestion() {
                if (!this.state.isRunning) return;

                // 清除所有未完成的計時器與語音
                clearInterval(this.state.timerId);
                clearTimeout(this.state.autoNextTimeoutId);
                this.synth.cancel();

                // 隨機產生 1~10 的乘法題目
                this.state.num1 = Math.floor(Math.random() * 10) + 1;
                this.state.num2 = Math.floor(Math.random() * 10) + 1;
                this.state.answer = this.state.num1 * this.state.num2;

                // 更新練習題數
                this.state.totalPracticed++;
                this.dom.questionCount.textContent = this.state.totalPracticed;

                // 確保卡片正面朝上
                this.flipCard(false);

                // 更新文字顯示
                this.dom.questionText.textContent = `${this.state.num1} × ${this.state.num2}`;
                this.dom.questionSubtext.textContent = `語音已朗讀：${this.state.num1}、${this.state.num2}`;

                this.dom.answerEquation.textContent = `${this.state.num1} × ${this.state.num2} =`;
                this.dom.answerText.textContent = this.state.answer;

                // 播放題目語音（只唸數字）
                this.speakQuestion();

                // 開始 5 秒倒數
                this.startCountdown();
            }

            /**
             * 5 秒倒數計時邏輯
             */
            startCountdown() {
                this.state.timerSeconds = 5;
                this.dom.timerCountdown.textContent = "5";
                this.dom.timerContainer.classList.remove('opacity-30');
                this.updateCircleProgress(5, 5);

                clearInterval(this.state.timerId);

                this.state.timerId = setInterval(() => {
                    if (this.state.isPaused) return;

                    this.state.timerSeconds--;
                    this.dom.timerCountdown.textContent = this.state.timerSeconds;
                    this.updateCircleProgress(this.state.timerSeconds, 5);

                    if (this.state.timerSeconds <= 0) {
                        clearInterval(this.state.timerId);
                        this.revealAnswer();
                    }
                }, 1000);
            }

            /**
             * 更新 5 秒倒數圓環進度條 SVG
             */
            updateCircleProgress(current, total) {
                const circumference = 2 * Math.PI * 42;
                const offset = circumference - (current / total) * circumference;
                this.dom.timerSvgCircle.style.strokeDashoffset = offset;
            }

            /**
             * 倒數結束：翻牌揭曉答案並朗讀
             */
            revealAnswer() {
                this.flipCard(true);

                // 朗讀答案（僅數字）
                this.speakAnswer();

                // 3 秒後自動切換至下一題
                this.dom.autoNextTip.textContent = "🎉 3 秒後自動進入下一題...";
                this.state.autoNextTimeoutId = setTimeout(() => {
                    if (this.state.isRunning && !this.state.isPaused) {
                        this.nextQuestion();
                    }
                }, 3500);
            }

            /**
             * 卡片 3D 翻轉效果控制
             */
            flipCard(toBack) {
                this.state.isFlipped = toBack;
                if (toBack) {
                    this.dom.flashcard.classList.add('rotate-y-180');
                } else {
                    this.dom.flashcard.classList.remove('rotate-y-180');
                }
            }

            /**
             * 按鈕狀態更新
             */
            updateUIForRunningState() {
                this.updateStartPauseBtnUI();
                this.dom.nextBtn.disabled = false;
                this.dom.stopBtn.disabled = false;
            }

            updateUIForStoppedState() {
                this.dom.startPauseBtn.className = "w-full sm:flex-1 py-4 px-6 rounded-2xl bg-brand-green hover:bg-emerald-500 active:scale-95 text-white font-black text-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-3";
                this.dom.startPauseBtn.innerHTML = `<i class="fa-solid fa-play text-2xl"></i><span>開始練習</span>`;
                
                this.dom.nextBtn.disabled = true;
                this.dom.stopBtn.disabled = true;
            }

            updateStartPauseBtnUI() {
                if (this.state.isPaused) {
                    this.dom.startPauseBtn.className = "w-full sm:flex-1 py-4 px-6 rounded-2xl bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-black text-xl shadow-lg shadow-amber-200 transition-all flex items-center justify-center gap-3";
                    this.dom.startPauseBtn.innerHTML = `<i class="fa-solid fa-play text-2xl"></i><span>繼續練習</span>`;
                } else {
                    this.dom.startPauseBtn.className = "w-full sm:flex-1 py-4 px-6 rounded-2xl bg-slate-700 hover:bg-slate-800 active:scale-95 text-white font-black text-xl shadow-lg shadow-slate-300 transition-all flex items-center justify-center gap-3";
                    this.dom.startPauseBtn.innerHTML = `<i class="fa-solid fa-pause text-2xl"></i><span>暫停練習</span>`;
                }
            }
        }

        // 當 HTML DOM 載入完畢後初始化應用程式
        window.addEventListener('DOMContentLoaded', () => {
            window.app = new MultiplicationApp();
        });
    </script>
</body>
</html>
