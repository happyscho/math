<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18以內加減法 氣球 PK 大賽</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: "Comic Sans MS", "Chalkboard SE", "BiauKai", "微軟正黑體", sans-serif;
            background: linear-gradient(135deg, #70e1f5 0%, #ffd194 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 8vh;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 100;
        }

        h1 {
            font-size: clamp(1.2rem, 2.5vw, 2.2rem);
            color: #2c3e50;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        label {
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            font-weight: bold;
            color: #34495e;
        }

        select, button {
            font-size: clamp(0.85rem, 1.3vw, 1.1rem);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            border: 2px solid #3498db;
            background: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button {
            background: #2ecc71;
            color: white;
            border: none;
            box-shadow: 0 4px 0 #27ae60;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #27ae60;
        }

        .game-board {
            flex: 1;
            display: flex;
            height: 92vh;
            width: 100%;
            position: relative;
        }

        .team-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            border-right: 4px dashed rgba(255, 255, 255, 0.6);
            overflow: hidden;
        }

        .team-column:last-child {
            border-right: none;
        }

        .team-red { background: rgba(255, 235, 235, 0.45); }
        .team-blue { background: rgba(235, 245, 255, 0.45); }
        .team-green { background: rgba(235, 255, 238, 0.45); }

        .team-header {
            padding: 0.8rem;
            text-align: center;
            z-index: 20;
        }

        .team-title {
            font-size: clamp(1.4rem, 2.8vw, 2.4rem);
            font-weight: 900;
            text-shadow: 2px 2px 0px white;
        }

        .team-red .team-title { color: #e74c3c; }
        .team-blue .team-title { color: #2980b9; }
        .team-green .team-title { color: #27ae60; }

        .score-board {
            font-size: clamp(1.2rem, 2.2vw, 1.8rem);
            font-weight: bold;
            color: #34495e;
            margin-top: 0.2rem;
        }

        .timer-container {
            width: 80%;
            height: 12px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 6px;
            margin: 0.5rem auto 0;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            transition: width 0.1s linear;
        }

        .question-box {
            background: #fff;
            border: 4px solid #34495e;
            border-radius: 16px;
            width: 85%;
            margin: 0.5rem auto;
            padding: 0.6rem 0;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            z-index: 20;
        }

        .question-text {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 900;
            color: #2c3e50;
            letter-spacing: 2px;
        }

        .balloon-area {
            flex: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            width: clamp(70px, 11vw, 120px);
            height: clamp(85px, 13vw, 140px);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: clamp(1.8rem, 3.5vw, 3.2rem);
            font-weight: 900;
            cursor: pointer;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 0 10px 15px rgba(0,0,0,0.15);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            will-change: transform, top, opacity;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 12px solid inherit;
        }

        .balloon::before {
            content: "";
            position: absolute;
            bottom: -28px;
            left: 50%;
            width: 2px;
            height: 18px;
            background: rgba(0,0,0,0.3);
        }

        .wrong-flash {
            animation: flashRed 0.4s ease-in-out;
        }

        @keyframes flashRed {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(231, 76, 60, 0.4); }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: white;
            border-radius: 24px;
            padding: 2.5rem 3rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform: scale(0.8);
            transition: transform 0.3s ease;
            max-width: 90%;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .winner-title {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 900;
            margin-bottom: 1rem;
        }

        .winner-btn {
            font-size: 1.5rem;
            padding: 0.8rem 2rem;
            margin-top: 1.5rem;
            border-radius: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎈 18以內加減法 氣球 PK 大賽</h1>
        <div class="controls">
            <label for="targetScore">獲勝目標：</label>
            <select id="targetScore">
                <option value="5">5 題</option>
                <option value="10" selected>10 題</option>
                <option value="15">15 題</option>
            </select>
            <button onclick="resetGame()">重新開始</button>
        </div>
    </header>

    <div class="game-board">
        <!-- 紅隊 -->
        <div class="team-column team-red" id="team-red">
            <div class="team-header">
                <div class="team-title">紅隊</div>
                <div class="score-board">得分: <span id="score-red">0</span></div>
                <div class="timer-container"><div class="timer-bar" id="timer-red"></div></div>
            </div>
            <div class="question-box">
                <div class="question-text" id="q-red">? + ?</div>
            </div>
            <div class="balloon-area" id="area-red"></div>
        </div>

        <!-- 藍隊 -->
        <div class="team-column team-blue" id="team-blue">
            <div class="team-header">
                <div class="team-title">藍隊</div>
                <div class="score-board">得分: <span id="score-blue">0</span></div>
                <div class="timer-container"><div class="timer-bar" id="timer-blue"></div></div>
            </div>
            <div class="question-box">
                <div class="question-text" id="q-blue">? - ?</div>
            </div>
            <div class="balloon-area" id="area-blue"></div>
        </div>

        <!-- 綠隊 -->
        <div class="team-column team-green" id="team-green">
            <div class="team-header">
                <div class="team-title">綠隊</div>
                <div class="score-board">得分: <span id="score-green">0</span></div>
                <div class="timer-container"><div class="timer-bar" id="timer-green"></div></div>
            </div>
            <div class="question-box">
                <div class="question-text" id="q-green">? + ?</div>
            </div>
            <div class="balloon-area" id="area-green"></div>
        </div>
    </div>

    <!-- 獲勝彈窗 -->
    <div class="modal-overlay" id="winnerModal">
        <div class="modal">
            <div class="winner-title" id="winnerText">🎉 紅隊獲勝！ 🎉</div>
            <button class="winner-btn" onclick="resetGame()">再玩一次</button>
        </div>
    </div>

    <script>
        const DURATION = 12000; // 12 秒飄升時間
        const BALLOON_COLORS = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff6b81', '#00d2d3'];
        
        let targetScore = 10;
        let isGameOver = false;

        const teams = {
            red: { id: 'red', name: '紅隊', color: '#e74c3c', score: 0, currentAnswer: null, timerId: null, startTime: null, animFrameId: null },
            blue: { id: 'blue', name: '藍隊', color: '#2980b9', score: 0, currentAnswer: null, timerId: null, startTime: null, animFrameId: null },
            green: { id: 'green', name: '綠隊', color: '#27ae60', score: 0, currentAnswer: null, timerId: null, startTime: null, animFrameId: null }
        };

        // Web Audio API 音效生成器
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPopSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playWrongSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playWinSound() {
            initAudio();
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, now + idx * 0.12);
                gain.gain.linearRampToValueAtTime(0.3, now + idx * 0.12 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.12);
                osc.stop(now + idx * 0.12 + 0.4);
            });
        }

        // 產生 18 以內的加減法題目（完全不包含數字 0）
        function generateMathProblem() {
            const isAddition = Math.random() < 0.5;
            let num1, num2, answer, text;

            if (isAddition) {
                // 加法：和 <= 18，加數皆 >= 1
                answer = Math.floor(Math.random() * 17) + 2; // 和在 2 ~ 18
                num1 = Math.floor(Math.random() * (answer - 1)) + 1; // 1 ~ (answer-1)
                num2 = answer - num1; // 至少為 1
                text = `${num1} + ${num2} = ?`;
            } else {
                // 減法：被減數 <= 18，減數與差皆 >= 1
                num1 = Math.floor(Math.random() * 17) + 2; // 被減數 2 ~ 18
                num2 = Math.floor(Math.random() * (num1 - 1)) + 1; // 減數 1 ~ (num1-1)
                answer = num1 - num2; // 差至少為 1
                text = `${num1} - ${num2} = ?`;
            }

            // 產生 2 個干擾選項（排除 0）
            let choices = new Set([answer]);
            while (choices.size < 3) {
                let offset = (Math.random() < 0.5 ? 1 : -1) * (Math.floor(Math.random() * 4) + 1);
                let fake = answer + offset;
                if (fake >= 1 && fake <= 18 && fake !== answer) {
                    choices.add(fake);
                }
            }

            return {
                text: text,
                answer: answer,
                options: Array.from(choices).sort(() => Math.random() - 0.5)
            };
        }

        function startQuestion(teamKey) {
            if (isGameOver) return;

            const team = teams[teamKey];
            const area = document.getElementById(`area-${teamKey}`);
            const qEl = document.getElementById(`q-${teamKey}`);
            const timerBar = document.getElementById(`timer-${teamKey}`);

            // 清除之前的氣球與動畫
            area.innerHTML = '';
            if (team.animFrameId) cancelAnimationFrame(team.animFrameId);
            if (team.timerId) clearTimeout(team.timerId);

            const problem = generateMathProblem();
            team.currentAnswer = problem.answer;
            qEl.textContent = problem.text;

            // 建立 3 個漂浮氣球
            const containerWidth = area.clientWidth;
            const containerHeight = area.clientHeight;

            const balloonsData = problem.options.map((optionValue, index) => {
                const el = document.createElement('div');
                el.className = 'balloon';
                el.textContent = optionValue;
                
                const bgClr = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
                el.style.backgroundColor = bgClr;
                el.style.borderColor = bgClr;

                // 隨機初始左右位置與擺動參數
                const baseX = (containerWidth / 4) * (index + 1) - 40;
                const amplitude = 25 + Math.random() * 25; // 左右擺動幅度
                const frequency = 0.002 + Math.random() * 0.002; // 擺動頻率
                const speedMult = 0.9 + Math.random() * 0.2; // 微幅速度差異

                area.appendChild(el);

                el.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    handleAnswer(teamKey, optionValue);
                });

                return { el, baseX, amplitude, frequency, speedMult };
            });

            // 啟動 12 秒動態飄升與擺動
            team.startTime = performance.now();

            function animate(now) {
                const elapsed = now - team.startTime;
                const progress = Math.min(elapsed / DURATION, 1);

                // 更新倒數時間條
                timerBar.style.width = `${(1 - progress) * 100}%`;

                balloonsData.forEach(b => {
                    const currentProgress = Math.min((elapsed * b.speedMult) / DURATION, 1);
                    const currentY = containerHeight - currentProgress * (containerHeight + 140);
                    const currentX = b.baseX + Math.sin(elapsed * b.frequency) * b.amplitude;
                    const opacity = currentProgress > 0.85 ? (1 - currentProgress) / 0.15 : 1;

                    b.el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
                    b.el.style.opacity = opacity;
                });

                if (progress < 1) {
                    team.animFrameId = requestAnimationFrame(animate);
                } else {
                    // 12 秒到期（未戳破）視為答錯
                    triggerWrongAnswer(teamKey);
                }
            }

            team.animFrameId = requestAnimationFrame(animate);
        }

        function handleAnswer(teamKey, selectedValue) {
            if (isGameOver) return;
            const team = teams[teamKey];

            if (selectedValue === team.currentAnswer) {
                // 答對
                playPopSound();
                team.score++;
                document.getElementById(`score-${teamKey}`).textContent = team.score;

                if (team.score >= targetScore) {
                    endGame(team);
                } else {
                    startQuestion(teamKey);
                }
            } else {
                // 答錯
                triggerWrongAnswer(teamKey);
            }
        }

        function triggerWrongAnswer(teamKey) {
            playWrongSound();
            const col = document.getElementById(`team-${teamKey}`);
            col.classList.add('wrong-flash');
            setTimeout(() => col.classList.remove('wrong-flash'), 400);

            // 答錯立即換下一題
            startQuestion(teamKey);
        }

        function endGame(winnerTeam) {
            isGameOver = true;
            playWinSound();

            // 停用所有動畫
            Object.keys(teams).forEach(k => {
                if (teams[k].animFrameId) cancelAnimationFrame(teams[k].animFrameId);
            });

            // 觸發全螢幕彩帶慶祝
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { y: 0.5 }
                });
            }

            const modal = document.getElementById('winnerModal');
            const winnerText = document.getElementById('winnerText');
            winnerText.style.color = winnerTeam.color;
            winnerText.textContent = `🎉 ${winnerTeam.name} 獲勝！ 🎉`;
            modal.classList.add('active');
        }

        function resetGame() {
            targetScore = parseInt(document.getElementById('targetScore').value);
            isGameOver = false;

            document.getElementById('winnerModal').classList.remove('active');

            Object.keys(teams).forEach(k => {
                teams[k].score = 0;
                document.getElementById(`score-${k}`).textContent = '0';
                startQuestion(k);
            });
        }

        // 初始化遊戲與調整畫面
        window.addEventListener('resize', () => {
            if (!isGameOver) {
                Object.keys(teams).forEach(k => startQuestion(k));
            }
        });

        window.onload = () => {
            resetGame();
        };
    </script>
</body>
</html>
