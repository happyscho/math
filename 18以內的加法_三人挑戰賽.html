<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>18以內加法 三隊氣球 PK 大賽</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Friendly & Readable Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Zen Maru Gothic', 'Fredoka One', cursive, sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            overflow: hidden;
            height: 100vh;
        }

        /* Float & Sway Animations for 12-Second Rising Balloons */
        @keyframes floatRise1 {
            0% { transform: translateY(110%) translateX(0px) rotate(0deg); opacity: 0; }
            8% { opacity: 1; }
            25% { transform: translateY(75%) translateX(-22px) rotate(-8deg); }
            50% { transform: translateY(45%) translateX(22px) rotate(10deg); }
            75% { transform: translateY(18%) translateX(-18px) rotate(-6deg); opacity: 1; }
            92% { opacity: 0.5; }
            100% { transform: translateY(-135%) translateX(12px) rotate(5deg); opacity: 0; }
        }

        @keyframes floatRise2 {
            0% { transform: translateY(110%) translateX(0px) rotate(0deg); opacity: 0; }
            8% { opacity: 1; }
            30% { transform: translateY(70%) translateX(26px) rotate(12deg); }
            60% { transform: translateY(35%) translateX(-26px) rotate(-12deg); }
            82% { transform: translateY(12%) translateX(18px) rotate(6deg); opacity: 1; }
            92% { opacity: 0.5; }
            100% { transform: translateY(-135%) translateX(-12px) rotate(-5deg); opacity: 0; }
        }

        @keyframes floatRise3 {
            0% { transform: translateY(110%) translateX(0px) rotate(0deg); opacity: 0; }
            8% { opacity: 1; }
            20% { transform: translateY(80%) translateX(-28px) rotate(-10deg); }
            55% { transform: translateY(40%) translateX(24px) rotate(8deg); }
            78% { transform: translateY(14%) translateX(-14px) rotate(-4deg); opacity: 1; }
            92% { opacity: 0.5; }
            100% { transform: translateY(-135%) translateX(18px) rotate(8deg); opacity: 0; }
        }

        .drift-rise-1 { animation: floatRise1 12s linear forwards; }
        .drift-rise-2 { animation: floatRise2 12s linear forwards; }
        .drift-rise-3 { animation: floatRise3 12s linear forwards; }

        /* Balloon Visual Styling */
        .balloon {
            position: absolute;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%;
            box-shadow: inset -8px -8px 18px rgba(0,0,0,0.2), 0 10px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            will-change: transform, opacity;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 10px solid currentColor;
        }

        .balloon-string {
            position: absolute;
            bottom: -32px;
            left: 50%;
            width: 2px;
            height: 26px;
            background: rgba(80, 80, 80, 0.45);
            transform: translateX(-50%);
        }

        .balloon-shine {
            position: absolute;
            top: 18%;
            left: 20%;
            width: 24%;
            height: 36%;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        /* Balloon Pop Animation */
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; filter: brightness(1.5); }
            100% { transform: scale(0); opacity: 0; }
        }

        .popping {
            animation: pop 0.18s forwards cubic-bezier(0.1, 0.8, 0.3, 1) !important;
        }

        /* Extra Large Problem Card Wood Panel Effect */
        .wood-panel {
            background: linear-gradient(to bottom, #ffffff 0%, #fffbeb 100%);
            border: 4px solid #f59e0b;
            box-shadow: 0 6px 0 #d97706, inset 0 2px 4px rgba(255,255,255,0.9);
        }

        .timer-progress {
            transition: width 0.1s linear;
        }

        /* Extra Large Math Font for Classroom Electronics / Whiteboards */
        .math-problem-text {
            font-size: clamp(2.5rem, 5.5vw, 4.2rem);
            line-height: 1.1;
            letter-spacing: 0.05em;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 1), 0px 4px 10px rgba(0, 0, 0, 0.12);
        }

        /* Red Flash Overlay for Incorrect Answer Alert */
        @keyframes flashRed {
            0% { background-color: rgba(239, 68, 68, 0.35); }
            100% { background-color: transparent; }
        }
        .flash-wrong {
            animation: flashRed 0.4s ease-out;
        }
    </style>
</head>
<body class="w-full h-screen flex flex-col justify-between p-2 select-none">

    <header class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-2 md:p-3 shadow-lg flex justify-between items-center z-20 border-2 border-white/60">
        <div class="flex items-center gap-2">
            <span class="text-2xl md:text-3xl">🎈</span>
            <h1 class="text-base md:text-2xl font-black text-gray-800 tracking-wide">18以內加法 三隊 PK 大賽</h1>
        </div>
        
        <!-- Controls: Audio Toggle, Target Score & Reset -->
        <div class="flex items-center gap-1.5 md:gap-4">
            <!-- Audio Toggle Button -->
            <button id="soundToggleBtn" onclick="toggleAudio()" class="bg-indigo-100 hover:bg-indigo-200 active:translate-y-0.5 text-indigo-800 font-bold py-1 px-2 md:px-3 rounded-xl border border-indigo-300 text-xs md:text-sm flex items-center gap-1 transition-all">
                <i id="soundIcon" class="fa-solid fa-volume-high text-indigo-600"></i>
                <span id="soundText" class="hidden sm:inline">音效開</span>
            </button>

            <!-- Target Score Selection -->
            <div class="flex items-center gap-1 bg-amber-100 border-2 border-amber-300 rounded-xl px-2 py-0.5 md:py-1 text-xs md:text-base font-bold text-amber-900">
                <i class="fa-solid fa-trophy text-amber-500"></i>
                <span>目標:</span>
                <select id="targetScoreSelect" onchange="changeTargetScore(this.value)" class="bg-transparent text-amber-950 font-extrabold cursor-pointer focus:outline-none">
                    <option value="5">5題</option>
                    <option value="10" selected>10題</option>
                    <option value="15">15題</option>
                </select>
            </div>
            
            <!-- Game Reset Button -->
            <button onclick="resetGame()" class="bg-rose-500 hover:bg-rose-600 active:translate-y-0.5 text-white font-bold py-1 px-2.5 md:px-3 rounded-xl shadow-[0_3px_0_#be123c] transition-all flex items-center gap-1 text-xs md:text-base">
                <i class="fa-solid fa-rotate-right"></i>
                <span>重置遊戲</span>
            </button>
        </div>
    </header>

    <main class="w-full flex-1 grid grid-cols-3 gap-1.5 md:gap-3 my-2 relative">
        
        <!-- LEFT TEAM: RED TEAM -->
        <section id="areaRed" class="bg-red-50/80 border-4 border-red-300 rounded-2xl md:rounded-3xl p-1.5 md:p-3 flex flex-col justify-between items-center relative overflow-hidden shadow-inner">
            <!-- Team Title & Score -->
            <div class="w-full flex justify-between items-center bg-red-500 text-white rounded-xl px-2 md:px-3 py-1 shadow-md z-10">
                <div class="flex items-center gap-1">
                    <span class="text-base md:text-xl">🔴</span>
                    <span class="font-black text-xs md:text-xl tracking-wider">紅隊</span>
                </div>
                <div class="text-sm md:text-xl font-black bg-white/20 px-2 py-0.5 rounded-lg">
                    <span id="scoreRed">0</span> / <span class="targetDisplay">10</span>
                </div>
            </div>

            <!-- Countdown Timer Progress Bar (12 Seconds) -->
            <div class="w-full bg-red-200 h-2.5 rounded-full overflow-hidden my-1 z-10 border border-red-300 shadow-inner">
                <div id="timerBarRed" class="bg-red-600 h-full w-full timer-progress"></div>
            </div>

            <!-- Addition Problem Card (Extra Large Font Display) -->
            <div class="wood-panel rounded-2xl p-2 md:p-4 w-full text-center my-1 shadow-lg z-10">
                <div class="math-problem-text font-black text-red-950">
                    <span id="questionRed">8 + 7 = ?</span>
                </div>
            </div>

            <!-- Floating Balloons Container -->
            <div id="balloonsRedContainer" class="w-full flex-1 relative overflow-hidden"></div>
        </section>

        <!-- MIDDLE TEAM: BLUE TEAM -->
        <section id="areaBlue" class="bg-blue-50/80 border-4 border-blue-300 rounded-2xl md:rounded-3xl p-1.5 md:p-3 flex flex-col justify-between items-center relative overflow-hidden shadow-inner">
            <!-- Team Title & Score -->
            <div class="w-full flex justify-between items-center bg-blue-500 text-white rounded-xl px-2 md:px-3 py-1 shadow-md z-10">
                <div class="flex items-center gap-1">
                    <span class="text-base md:text-xl">🔵</span>
                    <span class="font-black text-xs md:text-xl tracking-wider">藍隊</span>
                </div>
                <div class="text-sm md:text-xl font-black bg-white/20 px-2 py-0.5 rounded-lg">
                    <span id="scoreBlue">0</span> / <span class="targetDisplay">10</span>
                </div>
            </div>

            <!-- Countdown Timer Progress Bar (12 Seconds) -->
            <div class="w-full bg-blue-200 h-2.5 rounded-full overflow-hidden my-1 z-10 border border-blue-300 shadow-inner">
                <div id="timerBarBlue" class="bg-blue-600 h-full w-full timer-progress"></div>
            </div>

            <!-- Addition Problem Card (Extra Large Font Display) -->
            <div class="wood-panel rounded-2xl p-2 md:p-4 w-full text-center my-1 shadow-lg z-10">
                <div class="math-problem-text font-black text-blue-950">
                    <span id="questionBlue">9 + 6 = ?</span>
                </div>
            </div>

            <!-- Floating Balloons Container -->
            <div id="balloonsBlueContainer" class="w-full flex-1 relative overflow-hidden"></div>
        </section>

        <!-- RIGHT TEAM: GREEN TEAM -->
        <section id="areaGreen" class="bg-emerald-50/80 border-4 border-emerald-300 rounded-2xl md:rounded-3xl p-1.5 md:p-3 flex flex-col justify-between items-center relative overflow-hidden shadow-inner">
            <!-- Team Title & Score -->
            <div class="w-full flex justify-between items-center bg-emerald-600 text-white rounded-xl px-2 md:px-3 py-1 shadow-md z-10">
                <div class="flex items-center gap-1">
                    <span class="text-base md:text-xl">🟢</span>
                    <span class="font-black text-xs md:text-xl tracking-wider">綠隊</span>
                </div>
                <div class="text-sm md:text-xl font-black bg-white/20 px-2 py-0.5 rounded-lg">
                    <span id="scoreGreen">0</span> / <span class="targetDisplay">10</span>
                </div>
            </div>

            <!-- Countdown Timer Progress Bar (12 Seconds) -->
            <div class="w-full bg-emerald-200 h-2.5 rounded-full overflow-hidden my-1 z-10 border border-emerald-300 shadow-inner">
                <div id="timerBarGreen" class="bg-emerald-600 h-full w-full timer-progress"></div>
            </div>

            <!-- Addition Problem Card (Extra Large Font Display) -->
            <div class="wood-panel rounded-2xl p-2 md:p-4 w-full text-center my-1 shadow-lg z-10">
                <div class="math-problem-text font-black text-emerald-950">
                    <span id="questionGreen">5 + 8 = ?</span>
                </div>
            </div>

            <!-- Floating Balloons Container -->
            <div id="balloonsGreenContainer" class="w-full flex-1 relative overflow-hidden"></div>
        </section>
    </main>

    <div id="winnerModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white border-8 border-yellow-400 rounded-3xl p-6 text-center max-w-sm w-11/12 shadow-2xl">
            <div class="text-6xl mb-2">🏆</div>
            <h2 id="winnerText" class="text-3xl font-black text-gray-800 mb-2">
                紅隊獲勝！
            </h2>
            <p class="text-gray-600 font-bold text-base mb-6">第一個達成目標！算得又快又準！🎉</p>
            
            <button onclick="resetGame()" class="w-full bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 text-white font-black text-xl py-3 px-6 rounded-2xl shadow-[0_5px_0_#d97706] active:translate-y-1 transition-all">
                再玩一次 🚀
            </button>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer for Popping, Wrong Answer & Victory Sounds
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playPop() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                
                const bufferSize = this.ctx.sampleRate * 0.08;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1600, now);
                filter.frequency.exponentialRampToValueAtTime(100, now + 0.08);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);

                const osc = this.ctx.createOscillator();
                const oscGain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.06);
                oscGain.gain.setValueAtTime(0.6, now);
                oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.connect(oscGain);
                oscGain.connect(this.ctx.destination);
                osc.start(now);
            }

            playWrong() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(120, now + 0.12);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.28);
            }

            playWin() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.35);
                });
            }
        }

        const sound = new SoundFX();

        function toggleAudio() {
            sound.muted = !sound.muted;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');
            if (sound.muted) {
                icon.className = 'fa-solid fa-volume-xmark text-rose-500';
                text.innerText = '靜音';
            } else {
                icon.className = 'fa-solid fa-volume-high text-indigo-600';
                text.innerText = '音效開';
            }
        }

        const ROUND_TIME_SECONDS = 12;
        let targetScore = 10;
        let scores = { red: 0, blue: 0, green: 0 };
        let isGameOver = false;

        let problems = { red: null, blue: null, green: null };
        let timerIntervals = { red: null, blue: null, green: null };

        const balloonColors = [
            { bg: 'bg-red-500', text: 'text-red-500' },
            { bg: 'bg-amber-400', text: 'text-amber-400' },
            { bg: 'bg-emerald-500', text: 'text-emerald-500' },
            { bg: 'bg-sky-400', text: 'text-sky-400' },
            { bg: 'bg-purple-500', text: 'text-purple-500' },
            { bg: 'bg-pink-500', text: 'text-pink-500' }
        ];

        /* Generator for Addition within 18 */
        function generateAdditionProblem() {
            const num1 = Math.floor(Math.random() * 9) + 1; // 1~9
            const num2 = Math.floor(Math.random() * 9) + 1; // 1~9
            const answer = num1 + num2;

            const options = new Set([answer]);
            while (options.size < 3) {
                let delta = (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let wrongVal = answer + delta;
                if (wrongVal >= 2 && wrongVal <= 18 && wrongVal !== answer) {
                    options.add(wrongVal);
                }
            }

            return {
                num1,
                num2,
                answer,
                options: Array.from(options).sort(() => Math.random() - 0.5)
            };
        }

        /* 12-Second Countdown Logic */
        function startTimer(teamKey) {
            clearInterval(timerIntervals[teamKey]);
            const teamCap = teamKey.charAt(0).toUpperCase() + teamKey.slice(1);
            const timerBar = document.getElementById(`timerBar${teamCap}`);
            
            let elapsed = 0;
            const step = 100; // ms
            const totalMs = ROUND_TIME_SECONDS * 1000;

            timerBar.style.width = '100%';

            timerIntervals[teamKey] = setInterval(() => {
                if (isGameOver) {
                    clearInterval(timerIntervals[teamKey]);
                    return;
                }
                elapsed += step;
                const remainingRatio = Math.max(0, (totalMs - elapsed) / totalMs);
                timerBar.style.width = `${remainingRatio * 100}%`;

                if (elapsed >= totalMs) {
                    clearInterval(timerIntervals[teamKey]);
                    handleTimeout(teamKey);
                }
            }, step);
        }

        /* Rendering Floating Balloons */
        function renderBalloons(teamKey) {
            const teamCap = teamKey.charAt(0).toUpperCase() + teamKey.slice(1);
            const container = document.getElementById(`balloons${teamCap}Container`);
            const problem = problems[teamKey];
            container.innerHTML = '';

            const availableColors = [...balloonColors].sort(() => Math.random() - 0.5);
            const positions = [18, 50, 82];
            const shuffledPositions = [...positions].sort(() => Math.random() - 0.5);

            problem.options.forEach((optVal, index) => {
                const color = availableColors[index % availableColors.length];
                const leftPercent = shuffledPositions[index];
                const driftStyleIndex = (index % 3) + 1;

                const balloon = document.createElement('button');
                balloon.className = `balloon ${color.bg} text-white w-16 h-24 md:w-24 md:h-32 ${color.text} drift-rise-${driftStyleIndex}`;
                balloon.style.left = `${leftPercent}%`;
                balloon.style.animationDuration = `${ROUND_TIME_SECONDS}s`;
                balloon.setAttribute('data-value', optVal);

                const shine = document.createElement('div');
                shine.className = 'balloon-shine';
                balloon.appendChild(shine);

                const text = document.createElement('span');
                text.className = 'text-2xl md:text-4xl font-black text-white drop-shadow-md z-10';
                text.innerText = optVal;
                balloon.appendChild(text);

                const string = document.createElement('div');
                string.className = 'balloon-string';
                balloon.appendChild(string);

                balloon.onclick = () => handleAnswer(teamKey, optVal, balloon);

                container.appendChild(balloon);
            });

            startTimer(teamKey);
        }

        /* Trigger Red Alert Flash on Team Field */
        function triggerWrongAlert(teamKey) {
            const teamCap = teamKey.charAt(0).toUpperCase() + teamKey.slice(1);
            const area = document.getElementById(`area${teamCap}`);
            area.classList.remove('flash-wrong');
            // Trigger reflow to restart animation
            void area.offsetWidth;
            area.classList.add('flash-wrong');
        }

        /* Timeout Handling (12s Elapsed) */
        function handleTimeout(teamKey) {
            if (isGameOver) return;
            sound.playWrong();
            triggerWrongAlert(teamKey);
            loadNextQuestion(teamKey);
        }

        function loadNextQuestion(teamKey) {
            if (isGameOver) return;

            problems[teamKey] = generateAdditionProblem();
            const teamCap = teamKey.charAt(0).toUpperCase() + teamKey.slice(1);
            const prob = problems[teamKey];
            document.getElementById(`question${teamCap}`).innerText = `${prob.num1} + ${prob.num2} = ?`;
            renderBalloons(teamKey);
        }

        /* Option Click Handling with IMMEDIATE SWITCH ON ERROR */
        function handleAnswer(teamKey, selectedVal, balloonElem) {
            if (isGameOver) return;

            const problem = problems[teamKey];

            if (selectedVal === problem.answer) {
                // CORRECT ANSWER
                clearInterval(timerIntervals[teamKey]);
                sound.playPop();
                balloonElem.classList.add('popping');

                scores[teamKey]++;
                const teamCap = teamKey.charAt(0).toUpperCase() + teamKey.slice(1);
                document.getElementById(`score${teamCap}`).innerText = scores[teamKey];

                const teamNames = { red: '紅隊', blue: '藍隊', green: '綠隊' };

                if (scores[teamKey] >= targetScore) {
                    triggerWin(teamNames[teamKey]);
                } else {
                    setTimeout(() => loadNextQuestion(teamKey), 180);
                }
            } else {
                // INCORRECT ANSWER: Play wrong sound, flash red alert, and IMMEDIATELY switch question!
                clearInterval(timerIntervals[teamKey]);
                sound.playWrong();
                triggerWrongAlert(teamKey);
                loadNextQuestion(teamKey);
            }
        }

        /* Trigger Victory Sequence */
        function triggerWin(winnerTeamName) {
            isGameOver = true;
            Object.keys(timerIntervals).forEach(k => clearInterval(timerIntervals[k]));

            sound.playWin();

            const modal = document.getElementById('winnerModal');
            document.getElementById('winnerText').innerText = `🎉 ${winnerTeamName}獲勝！ 🎉`;
            modal.classList.remove('hidden');

            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
            setTimeout(() => {
                confetti({ particleCount: 90, angle: 60, spread: 70, origin: { x: 0 } });
                confetti({ particleCount: 90, angle: 120, spread: 70, origin: { x: 1 } });
            }, 250);
        }

        function changeTargetScore(val) {
            targetScore = parseInt(val, 10);
            document.querySelectorAll('.targetDisplay').forEach(el => el.innerText = targetScore);
            resetGame();
        }

        function resetGame() {
            isGameOver = false;
            Object.keys(timerIntervals).forEach(k => clearInterval(timerIntervals[k]));

            scores = { red: 0, blue: 0, green: 0 };
            document.getElementById('scoreRed').innerText = '0';
            document.getElementById('scoreBlue').innerText = '0';
            document.getElementById('scoreGreen').innerText = '0';
            document.getElementById('winnerModal').classList.add('hidden');

            loadNextQuestion('red');
            loadNextQuestion('blue');
            loadNextQuestion('green');
        }

        window.onload = () => {
            resetGame();
        };
    </script>
</body>
</html>
