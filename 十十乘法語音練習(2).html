<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十十乘法個人練習小助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FFD166',
                            green: '#06D6A0',
                            blue: '#118AB2',
                            pink: '#EF476F',
                            purple: '#8338EC'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '"Fredoka"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F0F4F8;
            background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* 3D 卡片翻轉效果 */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        
        /* 倒數圓環動畫 */
        .timer-circle {
            transition: stroke-dashoffset 1s linear;
        }

        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-bounce-gentle {
            animation: bounce-gentle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-slate-800 antialiased selection:bg-brand-yellow selection:text-slate-900">

    <!-- 頁首標題與語速切換 -->
    <header class="bg-white/90 backdrop-blur-md border-b-4 border-brand-yellow sticky top-0 z-20 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-brand-yellow flex items-center justify-center text-2xl shadow-sm animate-bounce-gentle">
                    ✏️
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-slate-800 tracking-wide flex items-center gap-2">
                        十十乘法 <span class="bg-brand-pink text-white text-xs px-2.5 py-0.5 rounded-full font-bold">1x1 ~ 10x10</span>
                    </h1>
                    <p class="text-xs text-slate-500 font-bold hidden sm:block">聽音思考．自主快樂學習</p>
                </div>
            </div>
            
            <!-- 語音速度選擇 -->
            <div class="flex items-center gap-2">
                <label for="header-speed-select" class="text-xs sm:text-sm font-bold text-slate-600">🗣️ 語速：</label>
                <select id="header-speed-select" class="bg-slate-100 hover:bg-slate-200 border-2 border-slate-200 text-slate-700 font-bold text-xs sm:text-sm px-3 py-1.5 rounded-xl transition focus:outline-none focus:border-brand-purple cursor-pointer">
                    <option value="0.5">超慢 (0.5x)</option>
                    <option value="0.7">慢速 (0.7x)</option>
                    <option value="1.0" selected>標準 (1.0x)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 主介面 -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col items-center justify-center gap-6">

        <!-- 統計數據 -->
        <div class="w-full bg-white rounded-2xl p-4 shadow-md border-2 border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-slate-100 px-4 py-2 rounded-xl border border-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-brand-blue text-lg"></i>
                    <span class="text-sm text-slate-500 font-bold">已練習：</span>
                    <span id="question-count" class="text-2xl font-black text-brand-blue">0</span>
                    <span class="text-sm text-slate-400 font-bold">題</span>
                </div>
            </div>

            <button id="reset-stats-btn" class="text-xs font-bold text-slate-400 hover:text-slate-600 underline cursor-pointer">
                重置計數
            </button>
        </div>

        <!-- 3D 翻轉展示卡片 -->
        <div class="w-full max-w-lg aspect-[4/3] sm:aspect-[16/10] perspective-1000 relative">
            <div id="flashcard" class="w-full h-full transform-style-3d relative rounded-3xl shadow-xl border-4 border-white bg-white">
                
                <!-- 卡片正面：題目與倒數 -->
                <div class="absolute inset-0 backface-hidden rounded-3xl bg-gradient-to-br from-amber-50 to-orange-50 p-6 flex flex-col items-center justify-between border-4 border-amber-200">
                    
                    <div class="w-full flex justify-between items-center">
                        <span class="text-xs md:text-sm font-bold bg-amber-200/70 text-amber-900 px-3 py-1 rounded-full flex items-center gap-1.5">
                            <i class="fa-solid fa-brain text-amber-700"></i> 思考中...
                        </span>
                        <button id="replay-audio-btn" title="重新朗讀題目" class="w-10 h-10 rounded-full bg-white hover:bg-amber-100 text-amber-600 shadow flex items-center justify-center transition active:scale-95 cursor-pointer">
                            <i class="fa-solid fa-volume-high text-lg"></i>
                        </button>
                    </div>

                    <!-- 題目大字體 -->
                    <div class="my-auto text-center">
                        <div id="question-text" class="text-5xl sm:text-7xl font-black text-slate-800 tracking-wider">
                            點擊開始
                        </div>
                    </div>

                    <!-- 3秒倒數圓環 -->
                    <div id="timer-container" class="relative w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center opacity-30 transition-opacity">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" class="text-amber-200" fill="transparent" />
                            <circle id="timer-svg-circle" cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" class="text-brand-pink timer-circle" fill="transparent" stroke-linecap="round" stroke-dasharray="263.89" stroke-dashoffset="0" />
                        </svg>
                        <span id="timer-countdown" class="absolute text-2xl sm:text-3xl font-black text-brand-pink">3</span>
                    </div>

                </div>

                <!-- 卡片背面：答案 -->
                <div class="absolute inset-0 backface-hidden rotate-y-180 rounded-3xl bg-gradient-to-br from-emerald-50 to-teal-50 p-6 flex flex-col items-center justify-between border-4 border-emerald-200">
                    
                    <div class="w-full flex justify-between items-center">
                        <span class="text-xs md:text-sm font-bold bg-emerald-200/70 text-emerald-900 px-3 py-1 rounded-full flex items-center gap-1">
                            <i class="fa-solid fa-star text-amber-400"></i> 答案揭曉
                        </span>
                        <button id="replay-answer-audio-btn" title="重新朗讀答案" class="w-10 h-10 rounded-full bg-white hover:bg-emerald-100 text-emerald-600 shadow flex items-center justify-center transition active:scale-95 cursor-pointer">
                            <i class="fa-solid fa-volume-high text-lg"></i>
                        </button>
                    </div>

                    <div class="my-auto text-center">
                        <div id="answer-equation" class="text-2xl sm:text-4xl font-bold text-slate-500 mb-2">
                            -
                        </div>
                        <div id="answer-text" class="text-6xl sm:text-8xl font-black text-brand-green tracking-tight">
                            -
                        </div>
                    </div>

                    <div class="text-xs sm:text-sm font-bold text-teal-700 bg-teal-100/70 px-4 py-1.5 rounded-full">
                        <span>🎉 3 秒後自動進入下一題...</span>
                    </div>

                </div>

            </div>
        </div>

        <!-- 按鈕控制列 -->
        <div class="w-full max-w-lg flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4">
            
            <button id="start-pause-btn" class="w-full sm:flex-1 py-4 px-6 rounded-2xl bg-brand-green hover:bg-emerald-500 active:scale-95 text-white font-black text-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-3 cursor-pointer">
                <i class="fa-solid fa-play text-2xl"></i>
                <span>開始練習</span>
            </button>

            <button id="next-btn" disabled class="w-full sm:w-auto py-4 px-8 rounded-2xl bg-brand-blue hover:bg-sky-600 active:scale-95 text-white font-black text-xl shadow-lg shadow-sky-200 transition-all flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
                <span>下一題</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <button id="stop-btn" disabled class="w-full sm:w-auto py-4 px-5 rounded-2xl bg-rose-100 hover:bg-rose-200 active:scale-95 text-rose-600 font-bold text-lg border border-rose-200 transition flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
                <i class="fa-solid fa-square"></i>
                <span class="sm:hidden">停止</span>
            </button>

        </div>

    </main>

    <footer class="mt-auto py-4 text-center text-slate-400 text-xs font-bold">
        專為國小學生設計 ｜ 語音朗讀只唸數字，留出思考空間
    </footer>

    <!-- 邏輯程式碼 -->
    <script>
        class MultiplicationApp {
            constructor() {
                this.state = {
                    num1: 0,
                    num2: 0,
                    answer: 0,
                    isRunning: false,
                    isPaused: false,
                    isFlipped: false,
                    timerSeconds: 3,
                    totalPracticed: 0,
                    timerId: null,
                    autoNextTimeoutId: null,
                    flipTimeoutId: null
                };

                this.speechRate = 1.0;
                this.synth = window.speechSynthesis;
                this.preferredVoice = null;
                this.currentUtterance = null;
                this.circleCircumference = 263.89; // 2 * Math.PI * 42

                this.dom = {
                    flashcard: document.getElementById('flashcard'),
                    questionText: document.getElementById('question-text'),
                    answerEquation: document.getElementById('answer-equation'),
                    answerText: document.getElementById('answer-text'),
                    timerContainer: document.getElementById('timer-container'),
                    timerCountdown: document.getElementById('timer-countdown'),
                    timerSvgCircle: document.getElementById('timer-svg-circle'),
                    questionCount: document.getElementById('question-count'),
                    startPauseBtn: document.getElementById('start-pause-btn'),
                    nextBtn: document.getElementById('next-btn'),
                    stopBtn: document.getElementById('stop-btn'),
                    resetStatsBtn: document.getElementById('reset-stats-btn'),
                    replayAudioBtn: document.getElementById('replay-audio-btn'),
                    replayAnswerAudioBtn: document.getElementById('replay-answer-audio-btn'),
                    speedSelect: document.getElementById('header-speed-select')
                };

                this.bindEvents();
                this.initVoices();
            }

            initVoices() {
                if (!this.synth) return;
                const setVoice = () => {
                    const voices = this.synth.getVoices();
                    this.preferredVoice = 
                        voices.find(v => v.lang === 'zh-TW' && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('HsiaoChen'))) ||
                        voices.find(v => v.lang === 'zh-TW') ||
                        voices.find(v => v.lang.includes('zh'));
                };
                setVoice();
                if (this.synth.onvoiceschanged !== undefined) {
                    this.synth.onvoiceschanged = setVoice;
                }
            }

            speakText(text) {
                if (!this.synth) return;
                
                this.synth.cancel();
                if (this.synth.paused) {
                    this.synth.resume();
                }

                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    this.currentUtterance = utterance;
                    
                    if (this.preferredVoice) {
                        utterance.voice = this.preferredVoice;
                    }
                    utterance.lang = 'zh-TW';
                    utterance.rate = this.speechRate;
                    utterance.pitch = 1.05;
                    utterance.volume = 1.0;

                    utterance.onend = () => {
                        this.currentUtterance = null;
                    };
                    utterance.onerror = () => {
                        this.currentUtterance = null;
                    };

                    this.synth.speak(utterance);
                }, 50);
            }

            bindEvents() {
                this.dom.startPauseBtn.addEventListener('click', () => this.toggleStartPause());
                this.dom.nextBtn.addEventListener('click', () => this.nextQuestion());
                this.dom.stopBtn.addEventListener('click', () => this.stopPractice());
                
                this.dom.resetStatsBtn.addEventListener('click', () => {
                    this.state.totalPracticed = 0;
                    this.dom.questionCount.textContent = '0';
                });

                this.dom.replayAudioBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.state.num1 > 0) this.speakQuestion();
                });

                this.dom.replayAnswerAudioBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.state.num1 > 0) this.speakAnswer();
                });

                this.dom.speedSelect.addEventListener('change', (e) => {
                    this.speechRate = parseFloat(e.target.value);
                });
            }

            clearAllTimers() {
                if (this.state.timerId) {
                    clearInterval(this.state.timerId);
                    this.state.timerId = null;
                }
                if (this.state.autoNextTimeoutId) {
                    clearTimeout(this.state.autoNextTimeoutId);
                    this.state.autoNextTimeoutId = null;
                }
                if (this.state.flipTimeoutId) {
                    clearTimeout(this.state.flipTimeoutId);
                    this.state.flipTimeoutId = null;
                }
            }

            toggleStartPause() {
                if (!this.state.isRunning) {
                    this.state.isRunning = true;
                    this.state.isPaused = false;
                    this.updateUIForRunningState();
                    this.nextQuestion();
                } else {
                    if (this.state.isPaused) {
                        this.state.isPaused = false;
                        this.updateUIForRunningState();
                        if (!this.state.isFlipped) {
                            this.startCountdown(this.state.timerSeconds);
                        } else {
                            this.scheduleAutoNext();
                        }
                    } else {
                        this.state.isPaused = true;
                        this.clearAllTimers();
                        if (this.synth) this.synth.cancel();
                        this.updateUIForRunningState();
                    }
                }
            }

            stopPractice() {
                this.state.isRunning = false;
                this.state.isPaused = false;
                this.clearAllTimers();
                if (this.synth) this.synth.cancel();

                this.state.isFlipped = false;
                this.dom.flashcard.classList.remove('rotate-y-180');
                
                setTimeout(() => {
                    this.dom.questionText.textContent = '點擊開始';
                    this.dom.answerEquation.textContent = '-';
                    this.dom.answerText.textContent = '-';
                    this.dom.timerContainer.classList.add('opacity-30');
                    this.updateTimerVisual(3);
                }, 200);

                this.updateUIForRunningState();
            }

            nextQuestion() {
                if (!this.state.isRunning) return;
                
                this.clearAllTimers();
                if (this.synth) this.synth.cancel();
                this.state.isPaused = false;
                this.updateUIForRunningState();

                const prepareNewQuestion = () => {
                    // 隨機產生 1~10 的乘法組合
                    this.state.num1 = Math.floor(Math.random() * 10) + 1;
                    this.state.num2 = Math.floor(Math.random() * 10) + 1;
                    this.state.answer = this.state.num1 * this.state.num2;

                    this.dom.questionText.textContent = `${this.state.num1} × ${this.state.num2}`;
                    this.dom.answerEquation.textContent = `${this.state.num1} × ${this.state.num2} =`;
                    this.dom.answerText.textContent = `${this.state.answer}`;

                    this.dom.timerContainer.classList.remove('opacity-30');
                    this.speakQuestion();
                    this.startCountdown(3);
                };

                // 如果卡片目前是背面（顯示答案狀態），先翻回正面再更新文字，防止提前曝露題目
                if (this.state.isFlipped) {
                    this.state.isFlipped = false;
                    this.dom.flashcard.classList.remove('rotate-y-180');
                    this.state.flipTimeoutId = setTimeout(prepareNewQuestion, 300);
                } else {
                    prepareNewQuestion();
                }
            }

            startCountdown(seconds) {
                this.state.timerSeconds = seconds;
                this.updateTimerVisual(this.state.timerSeconds);

                this.state.timerId = setInterval(() => {
                    if (this.state.isPaused || !this.state.isRunning) return;

                    this.state.timerSeconds--;
                    this.updateTimerVisual(this.state.timerSeconds);

                    if (this.state.timerSeconds <= 0) {
                        clearInterval(this.state.timerId);
                        this.state.timerId = null;
                        this.revealAnswer();
                    }
                }, 1000);
            }

            updateTimerVisual(seconds) {
                const displaySec = Math.max(0, seconds);
                this.dom.timerCountdown.textContent = displaySec;
                const progress = (3 - displaySec) / 3;
                const offset = this.circleCircumference * progress;
                this.dom.timerSvgCircle.style.strokeDashoffset = offset;
            }

            revealAnswer() {
                if (!this.state.isRunning) return;

                this.state.isFlipped = true;
                this.dom.flashcard.classList.add('rotate-y-180');

                this.state.totalPracticed++;
                this.dom.questionCount.textContent = this.state.totalPracticed;

                this.speakAnswer();
                this.scheduleAutoNext();
            }

            scheduleAutoNext() {
                this.state.autoNextTimeoutId = setTimeout(() => {
                    if (this.state.isRunning && !this.state.isPaused) {
                        this.nextQuestion();
                    }
                }, 3000);
            }

            speakQuestion() {
                this.speakText(`${this.state.num1}、 ${this.state.num2}`);
            }

            speakAnswer() {
                this.speakText(`${this.state.answer}`);
            }

            updateUIForRunningState() {
                if (!this.state.isRunning) {
                    this.dom.startPauseBtn.innerHTML = '<i class="fa-solid fa-play text-2xl"></i><span>開始練習</span>';
                    this.dom.startPauseBtn.className = 'w-full sm:flex-1 py-4 px-6 rounded-2xl bg-brand-green hover:bg-emerald-500 active:scale-95 text-white font-black text-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-3 cursor-pointer';
                    this.dom.nextBtn.disabled = true;
                    this.dom.stopBtn.disabled = true;
                } else if (this.state.isPaused) {
                    this.dom.startPauseBtn.innerHTML = '<i class="fa-solid fa-play text-2xl"></i><span>繼續練習</span>';
                    this.dom.startPauseBtn.className = 'w-full sm:flex-1 py-4 px-6 rounded-2xl bg-brand-yellow hover:bg-amber-400 active:scale-95 text-slate-900 font-black text-xl shadow-lg shadow-amber-200 transition-all flex items-center justify-center gap-3 cursor-pointer';
                    this.dom.nextBtn.disabled = false;
                    this.dom.stopBtn.disabled = false;
                } else {
                    this.dom.startPauseBtn.innerHTML = '<i class="fa-solid fa-pause text-2xl"></i><span>暫停</span>';
                    this.dom.startPauseBtn.className = 'w-full sm:flex-1 py-4 px-6 rounded-2xl bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-black text-xl shadow-lg shadow-amber-200 transition-all flex items-center justify-center gap-3 cursor-pointer';
                    this.dom.nextBtn.disabled = false;
                    this.dom.stopBtn.disabled = false;
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new MultiplicationApp();
        });
    </script>
</body>
</html>
